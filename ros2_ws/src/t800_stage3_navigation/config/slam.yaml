slam_toolbox:
  ros__parameters:
    use_sim_time: false
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    resolution: 0.05
    min_laser_range: 0.2
    max_laser_range: 20.0
    minimum_time_interval: 0.1
    transform_publish_period: 0.05
    map_update_interval: 2.0
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    do_loop_closing: true
