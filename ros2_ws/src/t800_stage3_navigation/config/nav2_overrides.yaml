# T800-specific overrides applied on top of the Nav2 Humble defaults.
# Linear and angular limits here are ROS cmd_vel limits. The MuJoCo bridge
# converts them into the normalized T800 walking-policy command space.
parameter_rewrites:
  base_frame_id: base_link
  robot_base_frame: base_link
  bt_loop_duration: 100
  default_server_timeout: 1000
  controller_frequency: 10.0
  transform_tolerance: 0.5
  z_resolution: 0.15
  max_vel_x: 0.5
  min_vel_x: 0.0
  max_vel_theta: 0.5
  max_speed_xy: 0.5
  xy_goal_tolerance: 0.20
  yaw_goal_tolerance: 3.141593
  vx_samples: 10
  vtheta_samples: 10
  expected_planner_frequency: 1.0

# These values are arrays or complete parameter blocks, which RewrittenYaml
# cannot add to the upstream file by key. Keep the source and replacement text
# together here so launch code contains no robot tuning constants.
text_replacements:
  "    alpha1: 0.2": "    set_initial_pose: true\n    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}\n    alpha1: 0.2"
  "      plugin: \"dwb_core::DWBLocalPlanner\"": "      plugin: \"nav2_rotation_shim_controller::RotationShimController\"\n      primary_controller: \"dwb_core::DWBLocalPlanner\"\n      angular_dist_threshold: 0.785398\n      forward_sampling_distance: 0.5\n      rotate_to_heading_angular_vel: 0.5\n      max_angular_accel: 1.0\n      simulate_ahead_time: 1.0\n      rotate_to_goal_heading: false"
  "max_velocity: [0.26, 0.0, 1.0]": "max_velocity: [0.5, 0.0, 0.5]"
  "min_velocity: [-0.26, 0.0, -1.0]": "min_velocity: [0.0, 0.0, -0.5]"
