# Stage-3 perception simulation configuration.
# `simulation` contains the currently validated values used by the program.
# `vendor_document_reference` is informational only and must not override the
# simulation until a calibration file or physical measurement resolves the FOV difference.
simulation:
  model: t800pro
  mount_camera: depth
  frame_id: lidar_link
  width: 240
  height: 180
  horizontal_fov_deg: 120.0
  vertical_fov_deg: 90.0
  vertical_up_deg: 33.10
  vertical_down_deg: 56.90
  horizontal_resolution_deg: 0.5
  vertical_resolution_deg: 0.5
  update_rate_hz: 10.0
  min_range_m: 0.2
  max_range_m: 30.0
  angular_stride: 1

vendor_document_reference:
  resolution: "approximately 240x180"
  horizontal_fov_deg: 120.0
  vertical_fov_deg: 85.0
  update_rate_hz: 10.0
  min_range_m: 0.2
  max_range_m_at_10_percent_reflectivity: 30.0
  measurement_accuracy: "+/-3 cm at 1 sigma"

mounting:
  status: provisional
  parent_body: LINK_HEAD_YAW
  calibration_required: true

head_module_imu:
  frame_id: sensor_imu_link
  target_rate_hz: 350.0
  # Typical vendor reference pose; replace with the unit calibration on hardware.
  parent_body: LINK_HEAD_YAW
  xyz_m: [0.051259, -0.02988, 0.031395]
  rpy_rad: [0.0, 0.13963, 0.0]
  angular_velocity_noise_stddev: 0.0
  linear_acceleration_noise_stddev: 0.0
  dropout_probability: 0.0
